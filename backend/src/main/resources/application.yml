server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: skillswap-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillswap}
    username: ${DB_USERNAME:skillswap}
    password: ${DB_PASSWORD:skillswap}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-.env-please-32-bytes-min}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    # Point this at your local Ollama instance. Changing models only
    # requires editing `ollama.model` below (or the OLLAMA_MODEL env var) —
    # no code changes needed.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}

  storage:
    # "local" (default, zero setup) or "cloudinary" (production).
    provider: ${STORAGE_PROVIDER:local}
    local:
      root-dir: ${STORAGE_LOCAL_ROOT_DIR:uploads}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/files}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
